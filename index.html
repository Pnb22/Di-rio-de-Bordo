<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Diário de Bordo - Aplicação PWA para registrar seus pensamentos e experiências diárias">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Diário de Bordo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Diário de Bordo</h1>
  <form id="form">
    <label for="titulo">Título</label>
<input id="titulo" type="text" placeholder="Título">

<label for="descricao">Descrição</label>
<input id="descricao" type="text" placeholder="Descrição">

<label for="data">Data</label>
<input id="data" type="date">
    <button type="submit">Adicionar</button>
  </form>
  <button id="installBtn" style="display: none;">Instalar App</button>
  <ul id="lista"></ul>
  <script src="script.js" defer></script>
</body>
</html>
